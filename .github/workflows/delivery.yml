name: Verify, release and deploy applications

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Workspace / ${{ matrix.command }}
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        command: [build, lint, test, typecheck, 'format:check']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        if: matrix.command == 'test'
        run: pnpm --filter @flowboard/web exec playwright install --with-deps chromium
      - run: pnpm ${{ matrix.command }}
        if: matrix.command != 'test'
      - run: pnpm test --filter='!@flowboard/ui'
        if: matrix.command == 'test'
      - name: Validate commit messages and PR title
        if: matrix.command == 'lint'
        run: pnpm commitlint:ci
      - name: Lint workflow definitions
        if: matrix.command == 'lint'
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  ui:
    name: UI / components and stories
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowboard/ui exec playwright install --with-deps chromium
      - run: pnpm test --filter=@flowboard/ui
        env:
          VITEST_PW_DEBUG: '1'

  containers:
    name: Compose / ${{ matrix.command }}
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command: ['docker:check', 'docker:dev:check']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - name: Install browser for production-image acceptance
        if: matrix.command == 'docker:check'
        run: pnpm --filter @flowboard/web exec playwright install --with-deps chromium
      - run: pnpm ${{ matrix.command }}

  release:
    name: Publish affected apps
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, ui, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: flowboard-application-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowboard/release-tools build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy released applications to preview
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CD_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: preview
    concurrency:
      group: flowboard-preview-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:preview
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ vars.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_API_SERVICE_ID: ${{ vars.NORTHFLANK_API_SERVICE_ID }}
          NORTHFLANK_WORKER_SERVICE_ID: ${{ vars.NORTHFLANK_WORKER_SERVICE_ID }}
