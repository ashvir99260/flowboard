extends: [spectral:oas]
rules:
  info-contact: off
  operation-description: error
  oas3-api-servers: off
  flowboard-versioned-paths:
    description: Domain paths use /v1; health is the explicit operational exception.
    severity: error
    given: $.paths
    then:
      function: schema
      functionOptions:
        schema:
          propertyNames:
            pattern: '^(/v1(/|$)|/health/(live|ready)$)'
  flowboard-cursor-only:
    description: Public pagination accepts cursor and limit, never offset aliases.
    severity: error
    given: $.paths.*.*.parameters[*].name
    then:
      function: pattern
      functionOptions:
        notMatch: '^(page|pageNumber|offset|skip|take|pageSize)$'
  flowboard-error-envelope:
    description: Every documented error response uses the shared typed envelope.
    severity: error
    resolved: false
    given: '$.paths.*.*.responses[?(@property.match(/^[45][0-9]{2}$/))]'
    then:
      - field: content.application/json.schema.$ref
        function: truthy
      - field: content.application/json.schema.$ref
        function: pattern
        functionOptions:
          match: '^#/components/schemas/ErrorResponseDto_Output$'
  operation-operationId: error
  flowboard-list-cursor:
    description: Paginated list operations expose cursor/limit and a typed page envelope.
    severity: error
    given: $.paths.*.*
    then:
      function: schema
      functionOptions:
        schema:
          if:
            type: object
            required: [operationId]
            properties:
              operationId: { pattern: '^list', not: { enum: [listScopeStatuses, listScopeFields] } }
          then:
            required: [parameters]
            properties:
              parameters:
                allOf:
                  - contains:
                      required: [name, in, schema]
                      properties:
                        name: { const: cursor }
                        in: { const: query }
                        schema:
                          required: [type]
                          properties:
                            type: { const: string }
                  - contains:
                      required: [name, in, schema]
                      properties:
                        name: { const: limit }
                        in: { const: query }
                        schema:
                          anyOf:
                            - required: [type, minimum, maximum]
                              properties:
                                type: { const: integer }
                                minimum: { type: number, minimum: 1 }
                                maximum: { type: number, maximum: 100 }
                            - required: [type, pattern]
                              properties:
                                type: { const: string }
                                pattern: { const: '^(?:[1-9]\d?|100)$' }
              responses:
                required: ['200']
                properties:
                  '200':
                    required: [content]
                    properties:
                      content:
                        required: [application/json]
                        properties:
                          application/json:
                            required: [schema]
                            properties:
                              schema:
                                required: [type, required, properties]
                                properties:
                                  type: { const: object }
                                  required:
                                    allOf:
                                      - contains: { const: items }
                                      - contains: { const: pageInfo }
                                  properties:
                                    required: [items, pageInfo]
                                    properties:
                                      items:
                                        required: [type, items]
                                        properties:
                                          type: { const: array }
                                          items:
                                            required: [type, properties]
                                            properties:
                                              type: { const: object }
                                              properties: { type: object, minProperties: 1 }
                                      pageInfo:
                                        required: [type, required, properties]
                                        properties:
                                          type: { const: object }
                                          required:
                                            allOf:
                                              - contains: { const: hasNextPage }
                                              - contains: { const: nextCursor }
                                          properties:
                                            required: [hasNextPage, nextCursor]
                                            properties:
                                              hasNextPage:
                                                required: [type]
                                                properties:
                                                  type: { const: boolean }
                                              nextCursor:
                                                required: [type, nullable]
                                                properties:
                                                  type: { const: string }
                                                  nullable: { const: true }
